<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASMR Beauty Spa</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header>
<h1>💗 Beauty Spa ASMR</h1>

<div class="money">
🪙 <span id="coins">0</span>
⭐ <span id="level">1</span>
</div>
</header>


<div class="girl-area">

<div id="cleaner">🫧</div>
<div id="brush">🖌️</div>


<div class="girl">

<div id="hair" class="hair pink"></div>

<div class="head">

<div class="eye e1"></div>
<div class="eye e2"></div>

<div class="cheek c1"></div>
<div class="cheek c2"></div>

<div class="mouth"></div>


<div class="spot s1"></div>
<div class="spot s2"></div>
<div class="spot s3"></div>


</div>


<div id="dress" class="dress pinkdress"></div>

</div>


</div>



<h2 id="mission">
🫧 Trascina il detergente sul viso
</h2>



<div class="panel">


<button onclick="selectTool('clean')">
🫧 Pulizia
</button>


<button onclick="selectTool('makeup')">
💄 Trucco
</button>


<button onclick="openShop()">
👗 Armadio
</button>


</div>



<div id="shop" class="shop hidden">

<h2>Guardaroba</h2>


<button onclick="changeDress('pink')">
🌸 Vestito rosa
</button>


<button onclick="buyDress('princess')">
👑 Principessa - 200🪙
</button>


<button onclick="buyDress('diamond')">
💎 Diamante - 500🪙
</button>


<h2>Capelli</h2>

<button onclick="changeHair('pink')">
💗 Rosa
</button>

<button onclick="changeHair('brown')">
🤎 Castani
</button>


</div>



<div id="message">
Benvenuta nella spa!
</div>


</div>


<script src="game.js"></script>

</body>
</html>
