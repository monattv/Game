<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ASMR Beauty Spa</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">


<header>
<h1>💗 ASMR Beauty Spa</h1>

<div class="stats">
🪙 <span id="coins">0</span>
⭐ Lv <span id="level">1</span>
</div>
</header>



<div id="customerName">
Cliente: Sofia 💕
</div>



<div class="character">


<div id="hair"></div>


<div id="face">


<div class="eye left"></div>
<div class="eye right"></div>


<div class="cheek leftCheek"></div>
<div class="cheek rightCheek"></div>


<div id="makeup"></div>


<div id="foam"></div>


<div class="spot s1"></div>
<div class="spot s2"></div>
<div class="spot s3"></div>


<div class="mouth"></div>


</div>



<div id="dress"></div>


</div>




<div class="progress">

<div id="progressBar"></div>

</div>



<h2 id="mission">
🫧 Passa il detergente sul viso
</h2>



<div id="tool">
🫧
</div>




<div class="buttons">


<button onclick="setTool('clean')">
🫧 Detergente
</button>


<button onclick="setTool('makeup')">
💄 Pennello trucco
</button>


<button onclick="nextCustomer()">
👧 Nuova cliente
</button>


<button onclick="openWardrobe()">
👗 Armadio
</button>


</div>




<div id="wardrobe" class="panel hidden">


<h3>Vestiti</h3>

<button onclick="changeDress('pink')">
🌸 Rosa
</button>


<button onclick="changeDress('blue')">
💙 Blu
</button>


<button onclick="changeDress('gold')">
✨ Oro
</button>



<h3>Capelli</h3>

<button onclick="changeHair('pink')">
💗 Rosa
</button>


<button onclick="changeHair('brown')">
🤎 Castani
</button>



</div>




<div id="message">
Benvenuta nella Spa!
</div>


</div>


<script src="game.js"></script>

</body>
</html>
