<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASMR Beauty Spa</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

<h1>💗 ASMR Beauty Spa 💗</h1>

<div class="stats">
🪙 Monete: <span id="coins">0</span>
<br>
⭐ Livello: <span id="level">1</span>
</div>


<div class="client">
<img src="https://i.imgur.com/8Km9tLL.png" id="girl">
</div>


<h2 id="task">Pulisci il viso della cliente ✨</h2>


<div class="tools">

<button onclick="clean()">🫧 Pulizia</button>

<button onclick="pimple()">✨ Cura pelle</button>

<button onclick="makeup()">💄 Trucco</button>

<button onclick="dress()">👗 Vestiti</button>

</div>


<div class="message" id="message">
Inizia il trattamento!
</div>


</div>

<script src="game.js"></script>

</body>
</html>
