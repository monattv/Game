<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incremental Game</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#1e1e2f;
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
}

#coin{
    font-size:40px;
    margin:20px;
}

button{
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:15px 25px;
    margin:10px;
    font-size:18px;
}

#click{
    background:#ffcc00;
}

.shop{
    background:#2f2f45;
    width:350px;
    margin:auto;
    padding:15px;
    border-radius:15px;
}

.upgrade{
    background:#4caf50;
    color:white;
    width:90%;
}

.stats{
    margin:20px;
    font-size:20px;
}
</style>

</head>
<body>

<h1>💰 Incremental Game</h1>

<div id="coin">0 Monete</div>

<button id="click">Guadagna</button>

<div class="stats">
<div>Per Click: <span id="perClick">1</span></div>
<div>Al Secondo: <span id="perSecond">0</span></div>
</div>

<div class="shop">
<h2>Negozio</h2>

<button class="upgrade" onclick="buyClick()">
Migliora Click
<br>
Costo: <span id="clickCost">10</span>
</button>

<br>

<button class="upgrade" onclick="buyAuto()">
Minatore Automatico
<br>
Costo: <span id="autoCost">25</span>
</button>

</div>

<script>

let money=0;

let clickPower=1;
let autoPower=0;

let clickCost=10;
let autoCost=25;

const coin=document.getElementById("coin");

function update(){

coin.innerHTML=Math.floor(money)+" Monete";

document.getElementById("perClick").innerHTML=clickPower;
document.getElementById("perSecond").innerHTML=autoPower;

document.getElementById("clickCost").innerHTML=Math.floor(clickCost);
document.getElementById("autoCost").innerHTML=Math.floor(autoCost);

}

document.getElementById("click").onclick=()=>{

money+=clickPower;
update();

}

function buyClick(){

if(money>=clickCost){

money-=clickCost;

clickPower++;

clickCost=Math.floor(clickCost*1.5);

update();

}

}

function buyAuto(){

if(money>=autoCost){

money-=autoCost;

autoPower++;

autoCost=Math.floor(autoCost*1.8);

update();

}

}

setInterval(()=>{

money+=autoPower;

update();

},1000);

function save(){

localStorage.setItem("incremental",JSON.stringify({

money,
clickPower,
autoPower,
clickCost,
autoCost

}));

}

function load(){

let s=localStorage.getItem("incremental");

if(!s) return;

let d=JSON.parse(s);

money=d.money;
clickPower=d.clickPower;
autoPower=d.autoPower;
clickCost=d.clickCost;
autoCost=d.autoCost;

update();

}

setInterval(save,3000);

load();
update();

</script>

</body>
</html>
