<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Incremental Game</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    overflow-x:hidden;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    user-select:none;
    -webkit-user-select:none;
    font-family:Arial,Helvetica,sans-serif;
    background:#1e1e2f;
    color:white;
    text-align:center;
}

h1{
    margin-top:25px;
}

#coin{
    font-size:42px;
    font-weight:bold;
    margin:25px 10px;
    transition:transform .12s;
}

button{
    cursor:pointer;
    border:none;
    border-radius:12px;
    padding:18px 28px;
    margin:10px;
    font-size:20px;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    transition:transform .08s,filter .2s;
}

button:active{
    transform:scale(.95);
}

#click{
    background:#ffcc00;
    color:#222;
    font-size:26px;
    font-weight:bold;
    width:280px;
}

#click:hover{
    filter:brightness(1.05);
}

.shop{
    background:#2f2f45;
    width:min(360px,92%);
    margin:25px auto;
    padding:18px;
    border-radius:15px;
}

.upgrade{
    background:#4caf50;
    color:white;
    width:100%;
}

.stats{
    margin:20px;
    font-size:20px;
}

@media (max-width:500px){

#click{
    width:90%;
}

button{
    font-size:18px;
}

#coin{
    font-size:36px;
}

}

</style>

</head>

<body>

<h1>💰 Incremental Game</h1>

<div id="coin">0 Monete</div>

<button id="click">Guadagna</button>

<div class="stats">
<div>Per Click: <span id="perClick">1</span></div>
<div>Al Secondo: <span id="perSecond">0</span></div>
</div>

<div class="shop">

<h2>Negozio</h2>

<button class="upgrade" onclick="buyClick()">
Migliora Click
<br>
Costo: <span id="clickCost">10</span>
</button>

<button class="upgrade" onclick="buyAuto()">
Minatore Automatico
<br>
Costo: <span id="autoCost">25</span>
</button>

</div>

<script>

let money=0;

let clickPower=1;
let autoPower=0;

let clickCost=10;
let autoCost=25;

const coin=document.getElementById("coin");
const clickButton=document.getElementById("click");

function update(){

coin.textContent=Math.floor(money)+" Monete";

document.getElementById("perClick").textContent=clickPower;
document.getElementById("perSecond").textContent=autoPower;

document.getElementById("clickCost").textContent=Math.floor(clickCost);
document.getElementById("autoCost").textContent=Math.floor(autoCost);

coin.style.transform="scale(1.08)";

setTimeout(()=>{
    coin.style.transform="scale(1)";
},80);

}

clickButton.addEventListener("pointerdown",function(e){

e.preventDefault();

money+=clickPower;

update();

});

function buyClick(){

if(money>=clickCost){

money-=clickCost;

clickPower++;

clickCost=Math.floor(clickCost*1.5);

update();

}

}

function buyAuto(){

if(money>=autoCost){

money-=autoCost;

autoPower++;

autoCost=Math.floor(autoCost*1.8);

update();

}

}

setInterval(function(){

money+=autoPower;

update();

},1000);

function save(){

localStorage.setItem("incremental",JSON.stringify({

money,
clickPower,
autoPower,
clickCost,
autoCost

}));

}

function load(){

const s=localStorage.getItem("incremental");

if(!s) return;

const d=JSON.parse(s);

money=d.money||0;
clickPower=d.clickPower||1;
autoPower=d.autoPower||0;
clickCost=d.clickCost||10;
autoCost=d.autoCost||25;

update();

}

setInterval(save,3000);

load();

update();

</script>

</body>
</html>
