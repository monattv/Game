<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASMR Beauty Cartoon Spa</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

<h1>💗 ASMR Cartoon Beauty Spa 💗</h1>

<div class="stats">
🪙 <span id="coins">0</span>
⭐ Livello <span id="level">1</span>
</div>


<h2 id="mission">
Pulisci il viso con il dito 🫧
</h2>


<div id="face">

<div class="hair"></div>

<div class="eye left"></div>
<div class="eye right"></div>

<div class="mouth"></div>


<div class="spot s1"></div>
<div class="spot s2"></div>
<div class="spot s3"></div>

</div>


<div class="tools">

<button id="cleanBtn">
🫧 Detergente
</button>

<button onclick="openCloset()">
👗 Armadio
</button>

</div>



<div id="closet" class="hidden">

<h2>Armadio</h2>

<button onclick="buyDress(0)">
👚 Vestito rosa GRATIS
</button>

<button onclick="buyDress(1)">
👑 Vestito principessa 🔒 200🪙
</button>

<button onclick="buyDress(2)">
💎 Vestito diamante 🔒 500🪙
</button>

</div>


<div id="message">
Inizia la spa!
</div>


</div>


<script src="game.js"></script>

</body>
</html>
