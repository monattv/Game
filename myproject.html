<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASMR Beauty Spa</title>

<link rel="stylesheet" href="style.css">
</head>

<body>


<div class="game">


<h1>💗 ASMR Beauty Spa</h1>


<div class="top">

🪙 <span id="coins">0</span>

⭐ Livello:
<span id="level">1</span>

</div>



<div class="customer">

<div id="hair"></div>


<div id="face">


<div class="eye left"></div>
<div class="eye right"></div>


<div class="mouth"></div>


<div id="foam"></div>


<div class="spot a"></div>
<div class="spot b"></div>
<div class="spot c"></div>


</div>


<div id="body"></div>


</div>



<div class="progress">

<div id="bar"></div>

</div>



<h2 id="mission">
🫧 Trascina il detergente sul viso
</h2>



<div id="tool">

🫧

</div>



<div class="buttons">


<button onclick="changeTool('clean')">
🫧 Pulizia
</button>


<button onclick="changeTool('makeup')">
💄 Trucco
</button>


<button onclick="openWardrobe()">
👗 Armadio
</button>


</div>



<div id="wardrobe" class="hidden">


<h3>Vestiti</h3>


<button onclick="dress('pink')">
🌸 Rosa
</button>


<button onclick="buyDress('blue')">
👑 Principessa 200🪙
</button>


<button onclick="buyDress('gold')">
💎 Diamante 500🪙
</button>



<h3>Capelli</h3>


<button onclick="hair('pink')">
💗 Rosa
</button>


<button onclick="hair('brown')">
🤎 Castani
</button>


</div>




<div id="message">

Inizia il trattamento!

</div>



</div>


<script src="game.js"></script>


</body>
</html>
